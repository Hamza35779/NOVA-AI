# NOVA AI Desktop — machine-local build pinning, opt-in.
#
# This file is COMMITTED but must stay INERT everywhere except the one
# machine that needs it (the local Windows box has no MSVC linker, so it
# builds the x86_64-pc-windows-gnu target with WinLibs gcc). On every
# other machine — CI (ubuntu / macos / windows-msvc) included — cargo
# must keep using the host default target and linker, otherwise `cargo
# test` fails with E0463 "can't find crate for `core`" because the GNU
# stdlib is not installed there.
#
# Opt in locally by setting NOVA_AI_GNU_TARGET=1 before cargo/tauri:
#
#   export NOVA_AI_GNU_TARGET=1
#   npx tauri build        # or: cargo test
#
# The [env] section below rewrites this file at build time via build.rs
# is NOT possible (config is read before build scripts run), so instead
# build.rs / tauri.conf handle the rest and this file only carries the
# documentation. The actual target/linker pinning lives in the user's
# %USERPROFILE%\.cargo\config.toml on machines that need it.
#
# See memory note "NOVA AI desktop build" for the full recipe.
