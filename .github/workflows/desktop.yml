name: Desktop Build & Release

on:
  push:
    tags:
      - 'v*'
      - 'desktop-v*'
  pull_request:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/desktop.yml'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g. v1.0.2.dev500). If set, autotag dispatches use this. github.ref still controls the checkout.'
        required: false
        type: string

concurrency:
  group: desktop-${{ inputs.tag || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libxdo-dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund

      - name: TypeScript type-check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: 'frontend/src-tauri -> target'

      # Validate never runs Vite, but compiling the app evaluates
      # tauri::generate_context!, which embeds frontendDist at build time and
      # fails when the directory is absent. A stub satisfies the macro; the
      # real build jobs get the genuine bundle from beforeBuildCommand.
      - name: Create frontend dist stub
        run: mkdir -p frontend/dist && echo '<html><body></body></html>' > frontend/dist/index.html

      # `cargo test` builds the crate (same coverage as the old `cargo check`)
      # and runs the unit tests, including the #331 uv-sync error-formatting
      # helpers. Static command, no untrusted input — no injection surface.
      - name: Cargo test
        working-directory: frontend/src-tauri
        run: cargo test

  # Remove stale artifacts from the desktop-edge rolling pre-release so that
  # only the current build's files are available for download. (The stable
  # `desktop-latest` channel the installed app polls is never cleaned here.)
  clean-release:
    needs: [validate]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Delete old assets from desktop-edge
        if: "!startsWith(github.ref, 'refs/tags/')"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="desktop-edge"
          # List all asset IDs on the release and delete them
          ASSET_IDS=$(gh api "repos/${{ github.repository }}/releases/tags/${TAG}" \
            --jq '.assets[].id' 2>/dev/null || true)
          for id in $ASSET_IDS; do
            echo "Deleting asset $id"
            gh api -X DELETE "repos/${{ github.repository }}/releases/assets/$id" || true
          done

  # Version/channel/updater decisions live here so both the build matrix and
  # the publish job can consume them.
  release-info:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.info.outputs.version }}
      tauri_version: ${{ steps.info.outputs.tauri_version }}
      tauri_config: ${{ steps.info.outputs.tauri_config }}
      tag: ${{ steps.info.outputs.tag }}
      name: ${{ steps.info.outputs.name }}
      prerelease: ${{ steps.info.outputs.prerelease }}
      has_updater: ${{ steps.info.outputs.has_updater }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine release info
        id: info
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/desktop-v* ]]; then
            # Explicit stable desktop release tag
            VERSION="${{ github.ref_name }}"
            VERSION="${VERSION#desktop-v}"
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
            echo "name=Desktop ${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            # Auto-tagged rolling build from autotag.yml — use the same
            # version as the CLI/PyPI release so all surfaces stay in sync.
            # Rolling/dev builds go to the `desktop-edge` channel, NOT the
            # `desktop-latest` channel the installed app polls — so users on
            # stable are never auto-updated onto an unvetted dev build.
            VERSION="${{ github.ref_name }}"
            VERSION="${VERSION#v}"
            echo "tag=desktop-edge" >> "$GITHUB_OUTPUT"
            echo "name=Desktop (Edge Build)" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            # workflow_dispatch fallback (manual UI dispatch without --ref).
            # Derive a PEP 440 dev version aligned with autotag.yml so we
            # don't burn the X.Y.Z release-version namespace.
            LATEST_RELEASE=$(git tag --list 'v[0-9]*' --merged HEAD \
              | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
            if [[ -z "$LATEST_RELEASE" ]]; then
              echo "::error::No release tag (vX.Y.Z) reachable from HEAD"
              exit 1
            fi
            BASE="${LATEST_RELEASE#v}"
            MAJOR=$(echo "$BASE" | cut -d. -f1)
            MINOR=$(echo "$BASE" | cut -d. -f2)
            PATCH=$(echo "$BASE" | cut -d. -f3 | sed -E 's/[^0-9].*$//')
            NEXT_PATCH=$((PATCH + 1))
            BUILD=$(git rev-list --count HEAD)
            VERSION="${MAJOR}.${MINOR}.${NEXT_PATCH}.dev${BUILD}"
            echo "tag=desktop-edge" >> "$GITHUB_OUTPUT"
            echo "name=Desktop (Edge Build)" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          # Tauri requires strict SemVer, and the MSI target additionally
          # requires a NUMERIC-only pre-release identifier ("dev" breaks WiX),
          # so PEP 440 `1.0.3.dev24` becomes `1.0.3-24`.
          TAURI_VERSION="${VERSION/.dev/-}"
          echo "tauri_version=${TAURI_VERSION}" >> "$GITHUB_OUTPUT"
          # Updater artifacts need the minisign private key. Without it, build
          # plain installers and disable createUpdaterArtifacts via the
          # --config override consumed by the build jobs — otherwise the
          # bundler fails with "A public key has been found, but no private
          # key".
          #
          # NOTE: without tauri-action, a signed build still needs latest.json
          # assembled manually before refresh-stable-channel can mirror it;
          # until then treat has_updater=true as producing signed artifacts
          # only (the in-app updater stays dormant without the manifest).
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "has_updater=true" >> "$GITHUB_OUTPUT"
            UPDATER_BUNDLE=true
          else
            echo "has_updater=false" >> "$GITHUB_OUTPUT"
            echo "::warning::TAURI_SIGNING_PRIVATE_KEY not set — building WITHOUT updater artifacts; in-app auto-update stays dormant until a signing key is added as a repo secret"
            UPDATER_BUNDLE=false
          fi
          printf 'tauri_config={"version":"%s","bundle":{"externalBin":["binaries/ollama"],"createUpdaterArtifacts":%s}}\n' \
            "$TAURI_VERSION" "$UPDATER_BUNDLE" >> "$GITHUB_OUTPUT"

  build-and-release:
    needs: [validate, clean-release, release-info]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: ''
          - platform: macos-14
            args: '--target universal-apple-darwin'
          - platform: windows-latest
            args: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libxdo-dev

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-14' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: 'frontend/src-tauri -> target'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund

      - name: Download Ollama sidecar
        shell: bash
        run: |
          set -o pipefail
          cd frontend/src-tauri/scripts && chmod +x download-ollama.sh
          if [[ "${{ matrix.platform }}" == "macos-14" ]]; then
            # Universal builds derive every sidecar name from ollama's one
            # fat darwin archive (see the script — there is nothing to lipo).
            ./download-ollama.sh universal-apple-darwin 2>&1 | tee /tmp/sidecar.log
          else
            ./download-ollama.sh 2>&1 | tee /tmp/sidecar.log
          fi

      - name: Configure Apple signing
        if: runner.os == 'macOS'
        env:
          CERT: ${{ secrets.APPLE_CERTIFICATE }}
          CERT_PASS: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          SIGN_ID: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          A_ID: ${{ secrets.APPLE_ID }}
          A_PASS: ${{ secrets.APPLE_PASSWORD }}
          A_TEAM: ${{ secrets.APPLE_TEAM_ID }}
        shell: bash
        run: |
          if [ -n "$CERT" ]; then
            echo "APPLE_CERTIFICATE=$CERT" >> "$GITHUB_ENV"
            echo "APPLE_CERTIFICATE_PASSWORD=$CERT_PASS" >> "$GITHUB_ENV"
            echo "APPLE_SIGNING_IDENTITY=$SIGN_ID" >> "$GITHUB_ENV"
            echo "APPLE_ID=$A_ID" >> "$GITHUB_ENV"
            echo "APPLE_PASSWORD=$A_PASS" >> "$GITHUB_ENV"
            echo "APPLE_TEAM_ID=$A_TEAM" >> "$GITHUB_ENV"
            echo "Apple signing configured"
          else
            echo "::warning::No Apple certificate configured — shipping an UNSIGNED macOS build. Users must bypass Gatekeeper on first launch (right-click > Open). Add APPLE_CERTIFICATE secrets for signed releases."
            echo "No Apple certificate configured, skipping code signing"
          fi

      # Raw CLI build. The config override MUST go through the v2 `--config`
      # flag: Tauri v1's TAURI_CONFIG environment variable is not read by the
      # v2 CLI, which left createUpdaterArtifacts active with no signing key
      # and failed every platform at the updater-signing step.
      - name: Build Tauri app
        shell: bash
        run: |
          set -o pipefail
          cd frontend
          npx tauri build ${{ matrix.args }} --config '${{ needs.release-info.outputs.tauri_config }}' 2>&1 | tee /tmp/tauri-build.log
          mkdir -p ../bundles-out
          find src-tauri/target -path '*bundle*' -type f \
            \( -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' \
               -o -name '*.dmg' -o -name '*.exe' -o -name '*.msi' \) \
            -exec cp {} ../bundles-out/ \;
          ls -lh ../bundles-out/

      - name: Upload bundles
        uses: actions/upload-artifact@v4
        with:
          name: bundles-${{ matrix.platform }}
          path: bundles-out/*
          if-no-files-found: error

      # TEMPORARY diagnostic: action logs are unreadable without login, so on
      # failure push the captured build log to a public branch where it can be
      # fetched anonymously via raw.githubusercontent.com. Delete once the
      # macOS/Windows lanes are green.
      - name: Push build log to ci-debug-logs-desktop
        if: failure()
        shell: bash
        run: |
          OUT="./tauri-build-${{ matrix.platform }}.log"
          {
            if [ -f /tmp/sidecar.log ]; then
              echo "=== Ollama sidecar download ==="
              cat /tmp/sidecar.log
              echo
            fi
            if [ -f /tmp/tauri-build.log ]; then
              echo "=== Tauri build ==="
              cat /tmp/tauri-build.log
            fi
          } > "$OUT"
          if [ ! -s "$OUT" ]; then
            echo "::warning::Neither sidecar nor build log exists to push"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f "$OUT"
          git commit -m "desktop build log (${{ matrix.platform }})"
          git push origin "HEAD:refs/heads/ci-debug-logs-desktop-${{ matrix.platform }}" --force

  publish-desktop:
    needs: [build-and-release, release-info]
    runs-on: ubuntu-latest
    steps:
      - name: Download built bundles
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: List assets
        run: ls -lh release-assets/

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release-info.outputs.tag }}
          name: ${{ needs.release-info.outputs.name }}
          body: 'Desktop application built from ${{ github.sha }}'
          draft: false
          prerelease: ${{ needs.release-info.outputs.prerelease == 'true' }}
          files: release-assets/*
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # When a stable `desktop-v*` release is published, repoint the
  # `desktop-latest` auto-update channel (the endpoint the installed app
  # polls) at it. Only meaningful for signed builds that produced an updater
  # manifest; without the signing key there is no latest.json to mirror.
  refresh-stable-channel:
    needs: [publish-desktop, release-info]
    if: startsWith(github.ref, 'refs/tags/desktop-v') && needs.release-info.outputs.has_updater == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Mirror stable latest.json into desktop-latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STABLE_TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          URL="https://github.com/${REPO}/releases/download/${STABLE_TAG}/latest.json"
          for attempt in 1 2 3 4 5; do
            if curl -fsSL -o latest.json "$URL"; then
              echo "Fetched ${STABLE_TAG}/latest.json on attempt ${attempt}"
              break
            fi
            echo "latest.json not ready yet (attempt ${attempt}); sleeping 15s"
            sleep 15
          done
          test -s latest.json || { echo "::error::Could not fetch ${URL}"; exit 1; }
          if ! gh release view desktop-latest --repo "$REPO" >/dev/null 2>&1; then
            gh release create desktop-latest --repo "$REPO" \
              --prerelease \
              --title "Desktop Auto-Update Channel" \
              --notes "Auto-update channel pointer for the desktop app. Mirrors the latest stable \`desktop-v*\` release; the in-app updater polls this \`latest.json\`. Download the app from the latest stable release, not here."
          fi
          gh release upload desktop-latest latest.json --repo "$REPO" --clobber
          echo "desktop-latest now mirrors ${STABLE_TAG}"
