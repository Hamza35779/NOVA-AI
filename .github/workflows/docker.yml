name: Docker build & smoke

# The Docker deploy path cannot be verified on every dev machine (Docker is
# not installed everywhere), so CI is the live check: build the same image
# `docker compose up` builds, then boot the container and hit /health — the
# exact first command a user following deploy/README.md would run.

on:
  pull_request:
    paths:
      - 'deploy/docker/**'
      - 'src/nova_ai/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'frontend/vite.config.ts'
      - 'frontend/package.json'
      - 'frontend/package-lock.json'
      - '.dockerignore'
      - '.github/workflows/docker.yml'
  push:
    branches: [main]
    paths:
      - 'deploy/docker/**'
      - '.github/workflows/docker.yml'
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & smoke-test image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (compose definition)
        # Build through the same compose file users run, so a drifted
        # context/dockerfile/env contract fails here, not for a user.
        # NOVA_AI_API_KEY must come from the environment: compose's ${VAR:?}
        # fail-fast rejects EMPTY values too, so --env-file with the blank
        # .env.example template fails interpolation even though the key name
        # is documented there.
        env:
          NOVA_AI_API_KEY: ci-build-placeholder
        run: >
          docker compose -f deploy/docker/docker-compose.yml build nova

      - name: Boot the stack and wait for /health
        # The container binds 0.0.0.0, so users must set a real API key
        # (compose fails fast without one) — the step env provides the
        # placeholder; the next step verifies the auth contract end-to-end.
        # `up -d nova` also starts the ollama sidecar via depends_on.
        env:
          NOVA_AI_API_KEY: ci-smoke-not-a-real-key
        run: |
          set -euo pipefail
          docker compose -f deploy/docker/docker-compose.yml up -d nova
          # Wait for uvicorn to accept connections (image has no curl).
          for i in $(seq 1 30); do
            code=$(docker compose -f deploy/docker/docker-compose.yml \
              exec -T nova python -c \
              "import urllib.request;print(urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=3).status)" \
              2>/dev/null || true)
            [ "$code" = "200" ] && break
            sleep 2
          done
          [ "$code" = "200" ] || {
            echo "::error::container /health never returned 200"
            docker compose -f deploy/docker/docker-compose.yml logs nova
            exit 1
          }
          echo "container /health: 200"

      - name: Smoke-test auth contract inside the container
        # The container binds 0.0.0.0, so users must set a real API key
        # (compose fails fast without one). The placeholder key puts the
        # server in auth-enabled mode and these checks verify the security
        # contract end-to-end: /health stays open for liveness probes,
        # /v1/models rejects requests without a Bearer key (401) and accepts
        # requests with the correct one (200).
        env:
          NOVA_AI_API_KEY: ci-smoke-not-a-real-key
        run: |
          set -euo pipefail
          COMPOSE="docker compose -f deploy/docker/docker-compose.yml"
          # Single-line base64 keeps the embedded Python free of YAML/bash
          # indentation traps; decode with -d and run with args: <url> [key].
          PROBE_B64=''
          code() { $COMPOSE exec -T nova python -c "$(echo "$PROBE_B64" | base64 -d)" "$1" "${2:-}"; }
          [ "$(code http://127.0.0.1:8000/health)" = "200" ] \
            || { echo "::error::health must stay open without a key"; exit 1; }
          [ "$(code http://127.0.0.1:8000/v1/models)" = "401" ] \
            || { echo "::error::v1/models must reject keyless requests (bound 0.0.0.0)"; exit 1; }
          [ "$(code http://127.0.0.1:8000/v1/models ci-smoke-not-a-real-key)" = "200" ] \
            || { echo "::error::v1/models must accept the correct Bearer key"; exit 1; }
          echo "auth contract OK: /health open, /v1/models 401 keyless / 200 with key"

      - name: Teardown
        if: always()
        env:
          NOVA_AI_API_KEY: ci-smoke-not-a-real-key
        run: >
          docker compose -f deploy/docker/docker-compose.yml down -v --remove-orphans
