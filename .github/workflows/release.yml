name: Build & Publish Release
on:
  push:
    tags:
      - 'v*'
    branches:
      - main
    paths:
      - '.github/workflows/release.yml'
  workflow_dispatch:
jobs:
  build-and-release:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact_name: nova-ai-windows-x64.zip
          - os: ubuntu-latest
            artifact_name: nova-ai-linux-amd64.deb
          - os: macos-latest
            artifact_name: nova-ai-macos.dmg
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install Dependencies & Build Tools
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pyinstaller
      # Windows .exe
      # --onedir (not --onefile): botocore's deep data paths exceed Windows
      # MAX_PATH during onefile temp extraction ("decompression resulted in
      # return code -1"). Zip the folder so users get one download; they
      # extract and run nova-ai-windows-x64.exe inside.
      # NOTE: no separate copy step — the pyinstaller output name already
      # matches artifact_name, and copying a file onto itself fails cmd.
      - name: Build Windows .exe
        if: matrix.os == 'windows-latest'
        run: |
          pyinstaller --noconfirm --onedir --name "nova-ai-windows-x64" src/nova_ai/cli/__init__.py
          Compress-Archive -Path dist\nova-ai-windows-x64\* -DestinationPath dist\${{ matrix.artifact_name }}.zip -Force
        shell: pwsh
      # Linux .deb
      - name: Build Debian (.deb) Package
        if: matrix.os == 'ubuntu-latest'
        run: |
          pyinstaller --noconfirm --onefile --name nova src/nova_ai/cli/__init__.py
          mkdir -p deb-pkg/DEBIAN deb-pkg/usr/local/bin
          cp dist/nova deb-pkg/usr/local/bin/nova
          cat << 'EOF' > deb-pkg/DEBIAN/control
          Package: nova-ai
          Version: 1.0.0
          Section: utils
          Priority: optional
          Architecture: amd64
          Maintainer: Hamza <hamza@example.com>
          Description: NOVA AI agentic workstation and CLI.
          EOF
          dpkg-deb --build deb-pkg dist/${{ matrix.artifact_name }}
      # macOS .dmg
      - name: Build macOS Application & Disk Image (.dmg)
        if: matrix.os == 'macos-latest'
        run: |
          pyinstaller --noconfirm --onedir --windowed --name "NOVA AI" src/nova_ai/cli/__init__.py
          hdiutil create -volname "NOVA AI" -srcfolder "dist/NOVA AI.app" -ov -format UDZO dist/${{ matrix.artifact_name }}
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.artifact_name }}
  publish-release:
    if: startsWith(github.ref, 'refs/tags/')
    name: Create GitHub Release
    needs: build-and-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
