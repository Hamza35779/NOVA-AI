name: Build & Publish Release
on:
  push:
    tags:
      - 'v*'
    branches:
      - main
    paths:
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact_name: nova-ai-windows-x64.zip
          - os: ubuntu-latest
            artifact_name: nova-ai-linux-amd64.deb
          - os: macos-latest
            artifact_name: nova-ai-macos.dmg
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install Dependencies & Build Tools
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pyinstaller
      # Windows .exe
      # --onedir (not --onefile): botocore's deep data paths exceed Windows
      # MAX_PATH during onefile temp extraction ("decompression resulted in
      # return code -1"). Zip the folder so users get one download; they
      # extract and run nova-ai-windows-x64.exe inside.
      # NOTE: no separate copy step — the pyinstaller output name already
      # matches artifact_name, and copying a file onto itself fails cmd.
      - name: Build Windows .exe
        if: matrix.os == 'windows-latest'
        run: |
          pyinstaller --noconfirm --onedir --name "nova-ai-windows-x64" src/nova_ai/cli/__init__.py
          # artifact_name already ends in .zip — appending another one here
          # made the upload step look for a nonexistent file and silently
          # skip ("No files were found"), so no Windows zip ever shipped.
          Compress-Archive -Path dist\nova-ai-windows-x64\* -DestinationPath dist\${{ matrix.artifact_name }} -Force
        shell: pwsh
      # Linux .deb
      - name: Build Debian (.deb) Package
        if: matrix.os == 'ubuntu-latest'
        run: |
          pyinstaller --noconfirm --onefile --name nova src/nova_ai/cli/__init__.py
          mkdir -p deb-pkg/DEBIAN deb-pkg/usr/local/bin
          cp dist/nova deb-pkg/usr/local/bin/nova
          cat << 'EOF' > deb-pkg/DEBIAN/control
          Package: nova-ai
          Version: 1.0.0
          Section: utils
          Priority: optional
          Architecture: amd64
          Maintainer: Hamza <hamza@example.com>
          Description: NOVA AI agentic workstation and CLI.
          EOF
          dpkg-deb --build deb-pkg dist/${{ matrix.artifact_name }}
      # macOS .dmg
      - name: Build macOS Application & Disk Image (.dmg)
        if: matrix.os == 'macos-latest'
        run: |
          pyinstaller --noconfirm --onedir --windowed --name "NOVA AI" src/nova_ai/cli/__init__.py
          hdiutil create -volname "NOVA AI" -srcfolder "dist/NOVA AI.app" -ov -format UDZO dist/${{ matrix.artifact_name }}
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.artifact_name }}
          if-no-files-found: error
  # Traditional Windows setup EXE, rebuilt from the ONEDIR payload the
  # build-and-release job already produced. The zip artifact IS the payload:
  # the Windows step zips dist/nova-ai-windows-x64/* at the archive root, so
  # expanding it back into dist/nova-ai-windows-x64/ recreates exactly the
  # directory deploy/windows/nova-ai-setup.iss packages. This restores the
  # NOVA-AI-Setup-<version>.exe asset that was last built by hand for v1.2.4.
  build-windows-setup:
    name: Windows Setup EXE (Inno)
    runs-on: windows-latest
    needs: build-and-release
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4

      - name: Download ONEDIR payload zip
        uses: actions/download-artifact@v4
        with:
          name: nova-ai-windows-x64.zip
          path: dist-zip

      - name: Extract payload
        shell: pwsh
        run: |
          Expand-Archive -Path dist-zip/nova-ai-windows-x64.zip -DestinationPath dist/nova-ai-windows-x64
          if (-not (Test-Path dist/nova-ai-windows-x64/nova-ai-windows-x64.exe)) {
            throw "payload extraction did not produce nova-ai-windows-x64.exe"
          }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build setup EXE
        shell: pwsh
        # The runner image usually ships Inno Setup already (choco then
        # no-ops). Locate ISCC on PATH first, then the two standard install
        # dirs — elements must be comma-separated array items, each quoted.
        run: |
          $candidates = @(
            "C:\Program Files (x86)\Inno Setup 6\ISCC.exe",
            "C:\Program Files\Inno Setup 6\ISCC.exe"
          )
          $cmd = Get-Command ISCC.exe -ErrorAction SilentlyContinue
          if ($cmd) {
            $iscc = $cmd.Source
          } else {
            $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $iscc) { throw "ISCC.exe not found (neither on PATH nor in standard install dirs)" }
          Write-Host "using ISCC: $iscc"
          & $iscc deploy\windows\nova-ai-setup.iss

      - name: Upload setup EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: nova-ai-windows-setup-exe
          path: dist/NOVA-AI-Setup-*.exe
          if-no-files-found: error

  publish-release:
    if: startsWith(github.ref, 'refs/tags/')
    name: Create GitHub Release
    needs: [build-and-release, build-windows-setup]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      # download-artifact with merge-multiple:true flattens every artifact
      # into release-assets/, so the setup EXE is already alongside the CLI
      # artifacts — just verify it made it (a missing Inno output must fail
      # the release, not silently ship without it).
      - name: Verify all release assets are present
        shell: bash
        run: |
          ls -lh release-assets/
          ls release-assets/NOVA-AI-Setup-*.exe >/dev/null \
            || { echo "::error::NOVA-AI-Setup-*.exe missing from merged artifacts"; exit 1; }
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
