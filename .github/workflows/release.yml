name: Build & Publish Release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
jobs:
  build-and-release:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact_name: nova-ai-windows-x64.exe
          - os: ubuntu-latest
            artifact_name: nova-ai-linux-amd64.deb
          - os: macos-latest
            artifact_name: nova-ai-macos.dmg
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install Dependencies & Build Tools
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pyinstaller
      # Windows .exe
      - name: Build Windows .exe
        if: matrix.os == 'windows-latest'
        run: |
          pyinstaller --noconfirm --onefile --name "nova-ai-windows-x64" src/nova_ai/cli/__init__.py
          if not exist dist mkdir dist
          copy dist\nova-ai-windows-x64.exe dist\${{ matrix.artifact_name }}
        shell: cmd
      # Linux .deb
      - name: Build Debian (.deb) Package
        if: matrix.os == 'ubuntu-latest'
        run: |
          pyinstaller --noconfirm --onefile --name nova src/nova_ai/cli/__init__.py
          mkdir -p deb-pkg/DEBIAN deb-pkg/usr/local/bin
          cp dist/nova deb-pkg/usr/local/bin/nova
          cat << 'EOF' > deb-pkg/DEBIAN/control
          Package: nova-ai
          Version: 1.0.0
          Section: utils
          Priority: optional
          Architecture: amd64
          Maintainer: Hamza <hamza@example.com>
          Description: NOVA AI agentic workstation and CLI.
          EOF
          dpkg-deb --build deb-pkg dist/${{ matrix.artifact_name }}
      # macOS .dmg
      - name: Build macOS Application & Disk Image (.dmg)
        if: matrix.os == 'macos-latest'
        run: |
          pyinstaller --noconfirm --onedir --windowed --name "NOVA AI" src/nova_ai/cli/__init__.py
          hdiutil create -volname "NOVA AI" -srcfolder "dist/NOVA AI.app" -ov -format UDZO dist/${{ matrix.artifact_name }}
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.artifact_name }}
  publish-release:
    name: Create GitHub Release
    needs: build-and-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
