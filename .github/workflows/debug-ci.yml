name: Debug CI

# Temporary diagnostic lane: the ci.yml lanes (clippy, maturin extension,
# Windows tests) and the desktop.yml raw tauri build fail only on GitHub
# runners, and neither action logs nor step summaries are readable without
# authentication. Each job here re-runs one failing step with output captured
# UNMASKED (real exit codes, no || true) and force-pushes the log file to its
# own branch (ci-debug-logs-*), which is publicly readable via
# raw.githubusercontent.com. Delete once the underlying failures are fixed.

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/debug-ci.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  clippy-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cargo cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: rust-${{ runner.os }}-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: rust-${{ runner.os }}-

      - name: Clippy (captured)
        shell: bash
        run: |
          set +e
          cd rust
          cargo clippy --workspace --all-targets -- -D warnings > "$GITHUB_WORKSPACE/clippy.log" 2>&1
          echo "clippy exit code: $?" >> "$GITHUB_WORKSPACE/clippy.log"
          tail -100 "$GITHUB_WORKSPACE/clippy.log"

      - name: Push log to ci-debug-logs-clippy
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f clippy.log
          git commit -m "clippy debug log"
          git push origin "HEAD:refs/heads/ci-debug-logs-clippy" --force

  maturin-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install uv
        uses: astral-sh/setup-uv@v8.0.0

      - name: Install dependencies
        run: uv sync --extra dev --extra framework-comparison --extra server

      - name: Maturin develop (captured)
        shell: bash
        run: |
          set +e
          uv run maturin develop --manifest-path rust/crates/nova_ai-python/Cargo.toml > "$GITHUB_WORKSPACE/maturin.log" 2>&1
          echo "maturin exit code: $?" >> "$GITHUB_WORKSPACE/maturin.log"
          tail -100 "$GITHUB_WORKSPACE/maturin.log"

      - name: Push log to ci-debug-logs-maturin
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f maturin.log
          git commit -m "maturin debug log"
          git push origin "HEAD:refs/heads/ci-debug-logs-maturin" --force

  win-test-probe:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v8.0.0

      - name: Install dependencies
        run: uv sync --extra dev --extra server

      - name: Windows tests (captured)
        shell: bash
        run: |
          set +e
          uv run pytest tests/hardware/test_hardware_profiles.py tests/cli/test_cli.py -m "not live and not cloud" --tb=short -q > "$GITHUB_WORKSPACE/win-tests.log" 2>&1
          echo "pytest exit code: $?" >> "$GITHUB_WORKSPACE/win-tests.log"
          tail -100 "$GITHUB_WORKSPACE/win-tests.log"

      - name: Push log to ci-debug-logs-wintest
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f win-tests.log
          git commit -m "windows test debug log"
          git push origin "HEAD:refs/heads/ci-debug-logs-wintest" --force

  # Replica of desktop.yml's failing "Build Tauri app" step (ubuntu lane):
  # identical setup, identical TAURI_CONFIG shape as release-info emits for a
  # dev build, identical command line — but with the real exit code captured.
  # This settles whether the raw CLI build itself fails on CI (probe-config
  # was masked by `|| true`, so the earlier bisect verdict is unreliable).
  tauri-build-probe:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libappindicator3-dev librsvg2-dev patchelf libxdo-dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: 'frontend/src-tauri -> target'

      - name: Download Ollama sidecar
        shell: bash
        run: |
          cd frontend/src-tauri/scripts && chmod +x download-ollama.sh
          ./download-ollama.sh

      - name: Raw tauri build (captured, unmasked)
        shell: bash
        env:
          TAURI_CONFIG: '{"version":"1.0.3-dev.99","bundle":{"externalBin":["binaries/ollama"],"createUpdaterArtifacts":false}}'
        run: |
          set +e
          cd frontend
          npx tauri build > "$GITHUB_WORKSPACE/tauri-build.log" 2>&1
          echo "tauri build exit code: $?" >> "$GITHUB_WORKSPACE/tauri-build.log"
          tail -120 "$GITHUB_WORKSPACE/tauri-build.log"

      - name: Push log to ci-debug-logs-tauribuild
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f tauri-build.log
          git commit -m "tauri build debug log"
          git push origin "HEAD:refs/heads/ci-debug-logs-tauribuild" --force
