name: Debug Desktop Build

# Temporary diagnostic lane: bisects the desktop.yml build failure.
#   probe-config : raw `npx tauri build` WITH the TAURI_CONFIG override used
#                  by desktop.yml (tests the injected JSON itself)
#   probe-action : tauri-action in build-only mode (no tagName/releaseName,
#                  so nothing is published) with the same override
# If probe-config passes but probe-action fails, the culprit is the action
# layer, not the project. Delete once the desktop build is green.

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/debug-desktop.yml'
      - 'frontend/src-tauri/**'
  workflow_dispatch:

jobs:
  probe-common:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libappindicator3-dev librsvg2-dev patchelf libxdo-dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: 'frontend/src-tauri -> target'

      - name: Download Ollama sidecar
        shell: bash
        run: |
          cd frontend/src-tauri/scripts && chmod +x download-ollama.sh
          ./download-ollama.sh

  probe-config:
    needs: [probe-common]
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libappindicator3-dev librsvg2-dev patchelf libxdo-dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: 'frontend/src-tauri -> target'

      - name: Download Ollama sidecar
        shell: bash
        run: |
          cd frontend/src-tauri/scripts && chmod +x download-ollama.sh
          ./download-ollama.sh

      - name: Raw tauri build with TAURI_CONFIG override
        shell: bash
        run: |
          set -o pipefail
          cd frontend
          export TAURI_CONFIG='{"version":"1.0.2","bundle":{"externalBin":["binaries/ollama"],"createUpdaterArtifacts":false}}'
          npx tauri build 2>&1 | tee /tmp/tauri-build.log || true
          {
            echo "## probe-config output tail"
            echo '```'
            tail -40 /tmp/tauri-build.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  probe-action:
    needs: [probe-common]
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libappindicator3-dev librsvg2-dev patchelf libxdo-dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: 'frontend/src-tauri -> target'

      - name: Download Ollama sidecar
        shell: bash
        run: |
          cd frontend/src-tauri/scripts && chmod +x download-ollama.sh
          ./download-ollama.sh

      - name: Tauri action (build-only, no release)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ''
          TAURI_CONFIG: '{"version":"1.0.2","bundle":{"externalBin":["binaries/ollama"],"createUpdaterArtifacts":false}}'
        with:
          projectPath: frontend
          tauriScript: npx tauri
          args: ''
